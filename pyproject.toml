[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nmap-xml-report"
version = "0.1.0"
description = "Offline, read-only Nmap XML summary and export CLI"
requires-python = ">=3.10"
dependencies = ["defusedxml==0.7.1"]

[project.scripts]
nmap-xml-report = "nmap_xml_report.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
